name: Qualidade

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: casa-nacoli-codex-kit

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: casa-nacoli-codex-kit/pnpm-lock.yaml

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar formatação
        run: pnpm format:check

      - name: Executar lint
        run: pnpm lint

      - name: Verificar tipos
        run: pnpm typecheck

      - name: Executar testes unitários
        run: pnpm test

      - name: Gerar build
        run: pnpm build

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Executar testes e2e e axe
        run: pnpm test:e2e
